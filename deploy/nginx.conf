# Installed in /etc/nginx/sites-available/roco (inside nginx's http context).
limit_req_zone $binary_remote_addr zone=roco_damage:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/roco/public;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location ^~ /api/damage/ {
        limit_req zone=roco_damage burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    # Debug sessions, model calls and data updates remain loopback-only.
    location /api/ { return 403; }
    location ~ /\. { deny all; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
